.side{position:sticky;top:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}

.note{margin:8px 0 0;font-size:13px;color:var(--muted)}
.cal .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal .mo{font-weight:700;font-size:14px;text-transform:capitalize}
.nav{width:32px;height:32px;border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--ink);cursor:pointer;font-size:16px;line-height:1}
.nav:hover{border-color:var(--ink)}
.nav:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
.day{position:relative;aspect-ratio:1;min-height:32px;border:0;border-radius:5px;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-variant-numeric:tabular-nums;padding:0;cursor:default}
.day.blank{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 1px var(--muted)}

.day.saved{background:var(--hv);color:var(--hv-ink);font-weight:700;cursor:pointer}
.day.saved:hover{filter:brightness(.95)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.empty{margin:0;padding:24px 0;color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;order:-1}
}
</style>
